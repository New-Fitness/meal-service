server:
  port: 8081

spring:
  application:
    name: meal-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_ai
    username: postgres
    password: password

  jooq:
    sql-dialect: POSTGRES

  profiles:
    active: dev   # 👈 по умолчанию dev

ai:
  ollama:
    base-url: http://localhost:11434
    init:
      pull-model-strategy: when_missing
    chat:
      options:
        model: llama3:latest
        temperature: 0.2

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG

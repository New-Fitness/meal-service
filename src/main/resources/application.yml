server:
  port: 8081

spring:
  application:
    name: meal-service
  profiles:
    active: dev  # по умолчанию

ai:
  ollama:
    base-url: http://localhost:11434
    init:
      pull-model-strategy: when_missing
    chat:
      options:
        model: llama3:latest
        temperature: 0.2

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG

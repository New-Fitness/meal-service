name: CI Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'develop']

jobs:
  # ======================================
  # 🔹 Stage 1: Security Check (placeholder)
  # ======================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder for Security Scan
        run: echo "⚙️ Security checks will be added here later"

  # ======================================
  # 🔹 Stage 2: Linter / Code Style
  # ======================================
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Placeholder for Lint / Style checks
        run: echo "🧩 Linting and static analysis will be added here later"

  # ======================================
  # 🔹 Stage 3: Build + Liquibase + jOOQ
  # ======================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: fitness_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fitness_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-Xmx2g"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle to use GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          EOF
          echo "✅ Gradle configured for GitHub Packages"

      - name: Verify access to GitHub Packages
        run: ./gradlew dependencies --info

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Grant execute permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Run Liquibase migrations
        run: ./gradlew update -Penv=prod --stacktrace

      - name: Build project
        run: ./gradlew clean update generateJooq build -Penv=prod --stacktrace

  # ======================================
  # 🔹 Stage 4: Tests (unit + integration)
  # ======================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: fitness_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fitness_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle to use GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          EOF
          echo "✅ Gradle configured for GitHub Packages"

      - name: Run unit + integration tests
        run: ./gradlew test -Penv=prod --stacktrace

  # ======================================
  # 🔹 Stage 5: Build on push (merge в main/develop)
  # ======================================
  build-on-push:
    name: Build on Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build]

    env:
      GITHUB_ACTOR: ${{ secrets.PACKAGE_ACTOR }}
      GITHUB_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle to use GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          EOF
          echo "✅ Gradle configured for GitHub Packages"

      - name: Final production build
        run: ./gradlew build -Penv=prod --stacktrace

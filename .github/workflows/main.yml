name: Build & Test (prod profile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ankane/pgvector:latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitness_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fitness_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      DB_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Grant execute permissions for Gradle wrapper
        run: chmod +x gradlew

      # ===============================
      # 🧱 Liquibase + jOOQ + Build
      # ===============================
      - name: Run Liquibase migrations
        run: ./gradlew update -Penv=prod --stacktrace

      - name: Generate jOOQ code
        run: ./gradlew generateJooq -Penv=prod --stacktrace

      - name: Build project
        run: ./gradlew build -Penv=prod --stacktrace

      # ===============================
      # 🧪 Tests
      # ===============================
      - name: Run Tests
        run: ./gradlew test -Penv=prod --stacktrace
